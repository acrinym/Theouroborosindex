name: Ouroboros semantic graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ouroboros
        run: python -m pip install --disable-pip-version-check -e 'engine[test]'
      - name: Compile and test
        run: |
          python -m compileall -q engine/src engine/tests
          python -m pytest -q engine/tests
          ouroboros --version
          ouroboros-index --version
          ouroboros-compare --version
          ouroboros-neighbors --version
          ouroboros-history --version
          ouroboros-drivers --version
          ouroboros-context --version
          ouroboros-story --version
          ouroboros-capabilities --version

  # The one intentional self-bite ran successfully on PR head
  # 382f274bc1782e8a84b95f9124792d388f991d00 (Actions run 31359852498).
  # It is intentionally not a recurring job. See results/self-bite-0.3.md.

  semantic-inaugural-four:
    needs: semantic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - repo: permissionlesstech/bitchat
            sha: 1f59e814f90c3f489f48d68262cb1bf640bf6181
            slug: bitchat
          - repo: srizzon/git-city
            sha: bb4d9102af6126970bbce1fb3e20d818df4a535f
            slug: git-city
          - repo: rdumasia303/deepseek_ocr_app
            sha: 3dac0741b18afc934c063e8528e7576f4d63efe5
            slug: deepseek-ocr-app
          - repo: ryokun6/ryos
            sha: c599b3102900f20f66c48dff2b4562d07ddd52cf
            slug: ryos
    steps:
      - name: Checkout Index analyzer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: index
      - name: Checkout target at frozen SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.sha }}
          path: target
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current semantic engine
        run: python -m pip install --disable-pip-version-check -e index/engine
      - name: Analyze frozen target without executing it
        env:
          TARGET_REPO: ${{ matrix.target.repo }}
          TARGET_SHA: ${{ matrix.target.sha }}
        run: |
          mkdir -p out
          ANALYZER_SHA="$(git -C index rev-parse HEAD)"
          OUROBOROS_ANALYZER_SOURCE_SHA="$ANALYZER_SHA" ouroboros target --canonical --quiet --json out/scan.json
          ANALYZER_SHA="$ANALYZER_SHA" python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('out/scan.json')
          payload = json.loads(path.read_text())
          payload['repository_name'] = os.environ['TARGET_REPO']
          payload['repository_sha'] = os.environ['TARGET_SHA']
          payload['analyzer']['source_head'] = os.environ['ANALYZER_SHA']
          path.write_text(json.dumps(payload, indent=2, sort_keys=True, allow_nan=False) + '\n')
          m = payload['semantic']['metrics']
          print(json.dumps({
              'repository': payload['repository_name'],
              'source_head': payload['analyzer']['source_head'],
              'symbols': m['symbol_count'],
              'product_symbols': m['direct_product_symbol_share'],
              'machinery_symbols': m['machinery_symbol_share'],
              'exact_resolution_rate': m['exact_resolution_rate'],
              'depth': m['max_recursive_depth'],
              'index': m['semantic_ouroboros_index'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-${{ matrix.target.slug }}
          path: out/scan.json
          if-no-files-found: error
          retention-days: 30

  aggregate-semantic:
    needs: semantic-inaugural-four
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-*
          path: artifacts
      - name: Build semantic comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [json.loads(path.read_text()) for path in Path('artifacts').glob('*/scan.json')]
          if len(rows) != 4:
              raise SystemExit(f'Expected four semantic records, found {len(rows)}')
          rows.sort(key=lambda row: row['semantic']['metrics']['semantic_ouroboros_index'], reverse=True)
          Path('aggregate').mkdir()
          Path('aggregate/semantic-inaugural-four-current.json').write_text(
              json.dumps(rows, indent=2, sort_keys=True, allow_nan=False) + '\n'
          )
          print('| Repository | Symbols | Product | Machinery | Exact | Resolvable | Depth | Semantic Index |')
          print('|---|---:|---:|---:|---:|---:|---:|---:|')
          for row in rows:
              m = row['semantic']['metrics']
              print(
                  f"| {row['repository_name']} | {m['symbol_count']} | "
                  f"{m['direct_product_symbol_share']*100:.1f}% | {m['machinery_symbol_share']*100:.1f}% | "
                  f"{m['exact_resolution_rate']*100:.1f}% | {m['resolution_rate']*100:.1f}% | "
                  f"{m['max_recursive_depth']} | {m['semantic_ouroboros_index']:.1f} |"
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-inaugural-four-current
          path: aggregate/
          if-no-files-found: error
          retention-days: 30
