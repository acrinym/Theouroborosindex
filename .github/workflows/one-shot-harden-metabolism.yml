name: One-shot harden Repository Metabolism

on:
  push:
    branches:
      - agent/metabolism-validation-runner-20260811

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repository-metabolism-20260811
          fetch-depth: 0
      - name: Preserve baseline as baseline, not a fake change
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('engine/src/ouroboros/metabolism.py')
          text = p.read_text()
          old = '                if path_value not in previous_fingerprint or previous_fingerprint[path_value] != fingerprint[path_value]:\n                    changed_history[path_value] = metadata\n'
          new = '                if index > 0 and (path_value not in previous_fingerprint or previous_fingerprint[path_value] != fingerprint[path_value]):\n                    changed_history[path_value] = metadata\n'
          if old not in text:
              raise SystemExit('metabolism change-history target not found')
          p.write_text(text.replace(old, new, 1))

          t = Path('engine/tests/test_metabolism.py')
          text = t.read_text()
          old = '    assert lonely["last_observed_use"] is None\n'
          new = old + '    assert lonely["last_observed_change"] is None\n'
          if old not in text:
              raise SystemExit('metabolism test target not found')
          t.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          python -m pip install --disable-pip-version-check -e 'engine[test]'
          python -m compileall -q engine/src engine/tests
          python -m pytest -q engine/tests
      - name: Commit and push
        run: |
          git config user.name 'Onyx Product Train'
          git config user.email 'actions@users.noreply.github.com'
          git add engine/src/ouroboros/metabolism.py engine/tests/test_metabolism.py
          git commit -m 'Keep metabolism baseline distinct from observed change'
          git push origin HEAD:agent/repository-metabolism-20260811
