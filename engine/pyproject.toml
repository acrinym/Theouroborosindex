[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-ouroboros"
version = "0.9.0"
description = "See how much of a repository is product versus machinery around the product"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter-language-pack==1.13.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ouroboros = "ouroboros.cli:main"
ouroboros-index = "ouroboros.index_cli:main"
ouroboros-compare = "ouroboros.compare_cli:main"
ouroboros-neighbors = "ouroboros.neighbors_cli:main"
ouroboros-history = "ouroboros.history_cli:main"
ouroboros-drivers = "ouroboros.drivers_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
