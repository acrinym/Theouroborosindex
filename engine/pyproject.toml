[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-ouroboros"
version = "0.2.0"
description = "Repository composition analysis with a language-neutral semantic source graph"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter-language-pack==1.13.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
